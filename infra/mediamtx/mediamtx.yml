# MediaMTX — LL-HLS / WHEP delivery origin for MoQ Test Tools.
# Publish with ffmpeg (SRT / RTMP / WHIP); play HLS or WHEP in the browser.
#
# Defaults match bluenviron/mediamtx; keep auth open for the public bench.
# Override the public IP via install script sed of webrtcAdditionalHosts.

logLevel: info
logDestinations: [stdout]

# Open bench: anonymous publish + read (lock down for non-demo deployments).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

api: yes
apiAddress: 127.0.0.1:9997
metrics: yes
metricsAddress: 127.0.0.1:9998

rtsp: yes
rtspAddress: :8554

rtmp: yes
rtmpAddress: :1935

# LL-HLS (Apple-style parts). Served over HTTP here; browsers reach it via
# the moq-web /api/playback/fetch HTTPS proxy (MediaMTX TLS not required).
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 9
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 60s

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"
# Wildcard is deliberate. This address is passed straight to net.ListenPacket,
# so it must be an address the host actually owns. On GCE the public IP lives on
# the 1:1 NAT, not on ens4 (ens4 is 10.128.0.2/32) — binding it fails with
# EADDRNOTAVAIL and MediaMTX aborts startup, taking LL-HLS/RTMP/SRT down with
# it. The install script may narrow this to the primary NIC address, but only
# after a bind preflight. See docs/WEBRTC-ICE.md.
webrtcLocalUDPAddress: :8189
# Only advertise the public IP. webrtcIPsFromInterfaces would add
# 127.0.0.1 / RFC1918 NIC addresses; ffmpeg's WHIP muxer picks those,
# ICE fails in the same second, and the UI shows "ffmpeg exited with
# code 69: Conversion failed!" (reproduced laptop→us-east1 2026-08-18).
# Browser WHIP still works because Chrome gathers srflx/prflx.
#
# NB: MediaMTX rewrites only the SDP it hands the client; the pion agent still
# gathers a host candidate per local IP. So "local candidate: host/udp/
# 127.0.0.1/8189" in the log is cosmetic, not a broken pair — the pair is real
# whenever the remote candidate is the peer's public address.
webrtcAdditionalHosts: ["34.9.217.178"]
webrtcIPsFromInterfaces: no

srt: yes
srtAddress: :8890

# Allow any path; publishers choose stream name (default: benchmark).
pathDefaults:
  source: publisher

paths:
  benchmark:
    source: publisher
  all_others:
    source: publisher
